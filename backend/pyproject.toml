[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chakybricks"
version = "1.0.0"
description = "ChakyBricks desktop lakehouse backend"
license = "Apache-2.0"
authors = [{ name = "Chaker Saidi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=2.0",
    "deltalake>=1.6",
    "pyarrow>=26",
    "pandas>=3.1",
    "openpyxl>=3.1",
    "psutil>=7.2",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "polars>=2.1",
    "numpy>=2.5",
    "ipykernel>=7.4",
    "jupyter_client>=8.10",
    "nbformat>=5.11",
    "matplotlib>=3.11",
    "matplotlib-inline>=0.2",
    "plotly>=7.1",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["chakybricks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chakybricks"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "psutil.*", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chakybricks.notebooks"]
disallow_untyped_calls = false
warn_return_any = false
