[package]
name = "chakybricks"
version = "0.1.0"
description = "ChakyBricks desktop lakehouse"
authors = ["Chaker Saidi"]
license = "Apache-2.0"
repository = "https://github.com/chaker88/ChakyBricks"
edition = "2021"

[lib]
name = "chakybricks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
